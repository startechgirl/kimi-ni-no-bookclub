<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bellota:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Cutive+Mono&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="css/img/favicon.png" type="image/png">
    <title>kimi ni no bookclub!</title>
</head>
<body>
    <section>
    <div class="login-box">
        <form action="#" method="get">
            <h2>login</h2>
            <br>
            <div class="input-box">
                <span class="icon"><ion-icon name="person-outline"></ion-icon></span>
                <input type="username" name="username" required>
                <label><em>nome de usuário</em></label>
            </div>
             <div class="input-box">
                <span class="icon"><ion-icon name="lock-closed-outline"></ion-icon></span>
                <input type="password" name="password" required>
                <label><em>senha</em></label>
            </div>
            <div class="remember-forgot">
                <label><input type="checkbox">lembre de mim</label>
                <a href="#">esqueci a senha</a>
            </div>
            <button type="submit">entrar</button>
            <div class="register-link">
                <p>não tem conta? <a href="#"><em>cadastre-se</em></a></p>
            </div>
        </form>
    </div>
    <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script><script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
    </section>
    <footer>
        <div align="center">
            <sub>kimi ni no bookclub ~ made with ♥︎ by startechgirl!</sub>
        </div>
    </footer>
</body>
</html>
